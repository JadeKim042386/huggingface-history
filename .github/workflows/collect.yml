name: collect

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: collect

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: command -v uv || pipx install uv
      # Record current values and fill missing past days from the public snapshots. The first run can take about 20 minutes.
      - run: ./hfhist.py backfill
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }} # only needed to track private repositories
      - run: ./hfhist.py chart
        if: ${{ !cancelled() }}
      # push what was collected even if some targets failed
      - name: commit
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "collect $(date -u +%F)"
          git pull --rebase
          git push
