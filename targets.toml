# What to keep a history of. kind is datasets | models | spaces.
#   "<kind>/<owner>/*"       every repository of the owner. Looked up on each run, so new ones join automatically.
#   "<kind>/<owner>/<name>"  a single repository.
# A repository deleted on Hugging Face stops being collected, but its records and its line in the charts remain.
targets = [
  "datasets/Spatial1ntelligence/*",
]

# Metrics to record per kind, named as the Hugging Face API `expand` fields.
[metrics]
datasets = ["downloadsAllTime", "downloads", "likes", "trendingScore"]
models = ["downloadsAllTime", "downloads", "likes", "trendingScore"]
spaces = ["likes", "trendingScore"]

# Charts shown in the README, in this order.
#   form:  line | area | bars (monthly increase) | card (current value)
#   style: auto (follows the viewer's light/dark setting) | light | dark | sketch (hand-drawn)
[[charts]]
metric = "downloadsAllTime"
form = "card"
style = "auto"

[[charts]]
metric = "downloadsAllTime"
form = "line"
style = "sketch"

[[charts]]
metric = "downloadsAllTime"
form = "bars"
style = "auto"

[[charts]]
metric = "downloads"
form = "area"
style = "light"

[[charts]]
metric = "likes"
form = "line"
style = "dark"
